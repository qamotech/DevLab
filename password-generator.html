<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
  :root {
    --bg-color: #0d1117;
    --card-bg: #161b22;
    --border-color: #30363d;
    --text-main: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #3182ce;
    --danger: #f85149;
    --warning: #d29922;
    --success: #2ea043;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-sans);
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  header {
    margin-bottom: 2rem;
    text-align: center;
  }

  h1 {
    font-family: var(--font-mono);
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: -0.05em;
    color: var(--accent);
  }

  h1::before {
    content: "> ";
    color: var(--text-muted);
  }

  .container {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    width: 100%;
    max-width: 480px;
    padding: 1.5rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .display-section {
    position: relative;
    margin-bottom: 1.5rem;
  }

  #password-display {
    width: 100%;
    background-color: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 1rem 3rem 1rem 1rem;
    font-family: var(--font-mono);
    font-size: 1.2rem;
    color: var(--text-main);
    text-align: left;
    word-break: break-all;
    min-height: 60px;
    display: flex;
    align-items: center;
  }

  .copy-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    border-radius: 4px;
    padding: 0.4rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .copy-btn:hover {
    color: var(--text-main);
    border-color: var(--text-muted);
    background: rgba(255,255,255,0.05);
  }

  .copy-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .strength-meter {
    margin-top: 0.75rem;
    height: 6px;
    background-color: var(--bg-color);
    border-radius: 3px;
    overflow: hidden;
    display: flex;
  }

  #strength-bar {
    height: 100%;
    width: 0%;
    transition: width 0.3s ease, background-color 0.3s ease;
  }

  .strength-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.4rem;
    text-align: right;
    text-transform: uppercase;
    font-weight: 600;
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 1.5rem;
  }

  .tab {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 0.75rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .tab.active {
    color: var(--text-main);
    border-bottom-color: var(--accent);
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  .control-group {
    margin-bottom: 1.25rem;
  }

  .control-group label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
    font-weight: 500;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    background: transparent;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    width: 100%;
    height: 6px;
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: 3px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 16px;
    width: 16px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: -6px;
  }

  .checkbox-group {
    display: flex;
    align-items: center;
    margin-bottom: 0.75rem;
  }

  .checkbox-group input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    margin-right: 10px;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .checkbox-group input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .checkbox-group input[type="checkbox"]:checked::after {
    content: "";
    width: 4px;
    height: 8px;
    border: solid var(--bg-color);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    margin-bottom: 2px;
  }

  .checkbox-group label {
    font-size: 0.9rem;
    cursor: pointer;
    margin: 0;
    user-select: none;
  }
  
  .btn-generate {
    width: 100%;
    background-color: var(--accent);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 0.85rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
    margin-top: 1rem;
    font-family: var(--font-mono);
  }

  .btn-generate:hover {
    background-color: var(--accent-hover);
  }

  select {
    width: 100%;
    padding: 0.5rem;
    background: var(--bg-color);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-family: var(--font-mono);
  }
</style>
</head>
<body>

<header>
  <h1>PassGen</h1>
</header>

<main class="container">
  <div class="display-section">
    <div id="password-display"></div>
    <button class="copy-btn" id="copy-btn" title="Copy to clipboard">
      <svg viewBox="0 0 16 16">
        <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25v-7.5Z"></path>
        <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25v-7.5Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25h-7.5Z"></path>
      </svg>
    </button>
    <div class="strength-meter">
      <div id="strength-bar"></div>
    </div>
    <div class="strength-label" id="strength-label">N/A</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-target="random">Random Characters</button>
    <button class="tab" data-target="memorable">Memorable Word</button>
  </div>

  <div id="random" class="tab-content active">
    <div class="control-group">
      <label>
        <span>Length</span>
        <span id="length-val">16</span>
      </label>
      <input type="range" id="length-slider" min="4" max="64" value="16">
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="uppercase" checked>
      <label for="uppercase">Uppercase (A-Z)</label>
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="lowercase" checked>
      <label for="lowercase">Lowercase (a-z)</label>
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="numbers" checked>
      <label for="numbers">Numbers (0-9)</label>
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="symbols" checked>
      <label for="symbols">Symbols (!@#$%^&*)</label>
    </div>
  </div>

  <div id="memorable" class="tab-content">
    <div class="control-group">
      <label>
        <span>Word Count</span>
        <span id="word-count-val">4</span>
      </label>
      <input type="range" id="word-count-slider" min="3" max="8" value="4">
    </div>
    <div class="control-group">
      <label>Separator</label>
      <select id="separator">
        <option value="-">Hyphen (-)</option>
        <option value="_">Underscore (_)</option>
        <option value=".">Period (.)</option>
        <option value=" ">Space</option>
        <option value="">None</option>
      </select>
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="capitalize" checked>
      <label for="capitalize">Capitalize Words</label>
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="include-number">
      <label for="include-number">Append Number</label>
    </div>
  </div>

  <button class="btn-generate" id="generate-btn">Generate Password</button>
</main>

<script>
  // DOM Elements
  const pwdDisplay = document.getElementById('password-display');
  const copyBtn = document.getElementById('copy-btn');
  const strengthBar = document.getElementById('strength-bar');
  const strengthLabel = document.getElementById('strength-label');
  const generateBtn = document.getElementById('generate-btn');
  const tabs = document.querySelectorAll('.tab');
  const tabContents = document.querySelectorAll('.tab-content');

  // Random Mode Elements
  const lengthSlider = document.getElementById('length-slider');
  const lengthVal = document.getElementById('length-val');
  const chkUpper = document.getElementById('uppercase');
  const chkLower = document.getElementById('lowercase');
  const chkNums = document.getElementById('numbers');
  const chkSyms = document.getElementById('symbols');

  // Memorable Mode Elements
  const wordCountSlider = document.getElementById('word-count-slider');
  const wordCountVal = document.getElementById('word-count-val');
  const separatorSel = document.getElementById('separator');
  const chkCapitalize = document.getElementById('capitalize');
  const chkIncludeNum = document.getElementById('include-number');

  // Character Sets
  const chars = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    nums: '0123456789',
    syms: '!@#$%^&*()_+~`|}{[]:;?><,./-='
  };

  // Common Memorable Words List
  const wordList = [
    "apple", "banana", "orange", "grape", "mango", "lemon", "peach", "cherry",
    "ocean", "river", "mountain", "forest", "desert", "valley", "island", "canyon",
    "tiger", "eagle", "dolphin", "wolf", "bear", "fox", "hawk", "lion",
    "piano", "guitar", "violin", "flute", "drum", "cello", "harp", "brass",
    "winter", "summer", "spring", "autumn", "frost", "breeze", "storm", "cloud",
    "copper", "silver", "gold", "iron", "steel", "bronze", "crystal", "glass",
    "coffee", "bread", "cheese", "butter", "honey", "sugar", "water", "juice",
    "purple", "yellow", "green", "blue", "crimson", "indigo", "violet", "amber",
    "rocket", "planet", "comet", "galaxy", "star", "moon", "orbit", "meteor",
    "castle", "bridge", "tower", "palace", "temple", "cabin", "house", "fort",
    "happy", "brave", "calm", "smart", "quick", "bright", "bold", "keen",
    "battery", "staple", "correct", "horse", "paper", "pencil", "cable", "screen"
  ];

  let currentMode = 'random';

  // Tab Switching
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.getAttribute('data-target');
      document.getElementById(currentMode).classList.add('active');
      generatePassword();
    });
  });

  // Slider Values Updates
  lengthSlider.addEventListener('input', (e) => {
    lengthVal.textContent = e.target.value;
    if(currentMode === 'random') generatePassword();
  });
  
  wordCountSlider.addEventListener('input', (e) => {
    wordCountVal.textContent = e.target.value;
    if(currentMode === 'memorable') generatePassword();
  });

  // Checkbox/Select listeners
  [chkUpper, chkLower, chkNums, chkSyms, separatorSel, chkCapitalize, chkIncludeNum].forEach(el => {
    el.addEventListener('change', generatePassword);
  });

  function getRandomInt(max) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }

  function generateRandomPassword() {
    let charset = '';
    if (chkUpper.checked) charset += chars.upper;
    if (chkLower.checked) charset += chars.lower;
    if (chkNums.checked) charset += chars.nums;
    if (chkSyms.checked) charset += chars.syms;

    if (charset === '') {
      chkLower.checked = true;
      charset += chars.lower;
    }

    const length = parseInt(lengthSlider.value);
    let pwd = '';
    for (let i = 0; i < length; i++) {
      pwd += charset[getRandomInt(charset.length)];
    }
    return pwd;
  }

  function generateMemorablePassword() {
    const count = parseInt(wordCountSlider.value);
    const sep = separatorSel.value;
    const capitalize = chkCapitalize.checked;
    
    let words = [];
    for (let i = 0; i < count; i++) {
      let word = wordList[getRandomInt(wordList.length)];
      if (capitalize) {
        word = word.charAt(0).toUpperCase() + word.slice(1);
      }
      words.push(word);
    }
    
    let pwd = words.join(sep);
    if (chkIncludeNum.checked) {
      pwd += sep + getRandomInt(100);
    }
    return pwd;
  }

  function calculateStrength(pwd) {
    let entropy = 0;
    if (currentMode === 'random') {
      let poolSize = 0;
      if (/[a-z]/.test(pwd)) poolSize += 26;
      if (/[A-Z]/.test(pwd)) poolSize += 26;
      if (/[0-9]/.test(pwd)) poolSize += 10;
      if (/[^a-zA-Z0-9]/.test(pwd)) poolSize += 32;
      entropy = pwd.length * Math.log2(poolSize || 1);
    } else {
      // Memorable word entropy approx (log2(100 words) ~ 6.6 bits per word)
      const count = parseInt(wordCountSlider.value);
      entropy = count * 11; // Assume wider dict logic conceptually
      if (chkIncludeNum.checked) entropy += 6.6; 
      if (chkCapitalize.checked) entropy += count;
    }

    if (entropy < 40) return { score: 1, label: 'Weak', color: 'var(--danger)', width: '25%' };
    if (entropy < 60) return { score: 2, label: 'Fair', color: 'var(--warning)', width: '50%' };
    if (entropy < 80) return { score: 3, label: 'Good', color: '#a371f7', width: '75%' };
    return { score: 4, label: 'Strong', color: 'var(--success)', width: '100%' };
  }

  function generatePassword() {
    let pwd = '';
    if (currentMode === 'random') {
      pwd = generateRandomPassword();
    } else {
      pwd = generateMemorablePassword();
    }
    
    pwdDisplay.textContent = pwd;
    
    const strength = calculateStrength(pwd);
    strengthBar.style.width = strength.width;
    strengthBar.style.backgroundColor = strength.color;
    strengthLabel.textContent = strength.label;
    strengthLabel.style.color = strength.color;
  }

  generateBtn.addEventListener('click', generatePassword);

  copyBtn.addEventListener('click', () => {
    const pwd = pwdDisplay.textContent;
    if (!pwd) return;
    navigator.clipboard.writeText(pwd).then(() => {
      const originalSVG = copyBtn.innerHTML;
      copyBtn.innerHTML = '<svg viewBox="0 0 16 16"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path></svg>';
      setTimeout(() => {
        copyBtn.innerHTML = originalSVG;
      }, 1500);
    });
  });

  // Init
  generatePassword();
</script>
<a href="index.html" style="position:fixed;bottom:14px;left:14px;background:#0ea5e9;color:#04121f;font:700 13px/1 system-ui,sans-serif;padding:10px 16px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(14,165,233,.4);z-index:9999;">← DevLab home</a>
</body>
</html>
