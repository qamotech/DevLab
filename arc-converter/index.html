<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arc Bev Co. — KG · G · OZ · LB Converter</title>
<meta name="description" content="Fast kilograms, grams, ounces and pounds converter for the dock. Arc Beverage Co.">
<meta name="theme-color" content="#070d1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070d1f'/%3E%3Cpath d='M14 50 A 26 26 0 0 1 50 14' fill='none' stroke='%231F51FF' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%23ffd34d'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#070d1f; --panel:#0e1730; --panel2:#111e3d; --line:#22345f;
    --blue:#1F51FF; --blue2:#5b83ff; --gold:#ffd34d; --text:#eef2ff; --muted:#93a4cc;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:22px 16px 30px; overflow-x:hidden; position:relative;
  }
  /* EFFECT 8: ambient drifting background glows */
  .glow{position:fixed; border-radius:50%; filter:blur(70px); opacity:.5; pointer-events:none; z-index:0}
  .glow.a{width:340px;height:340px;background:#1F51FF;top:-120px;left:-100px;animation:drift 16s ease-in-out infinite alternate}
  .glow.b{width:260px;height:260px;background:#0f2f8f;bottom:-90px;right:-70px;animation:drift 20s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(46px,30px) scale(1.12)}}
  .wrap{width:100%; max-width:430px; position:relative; z-index:1}
  header{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .logo{width:52px;height:52px;flex:0 0 auto}
  /* EFFECT 1: logo arc draw-in + glow pulse */
  .logo .arc{stroke-dasharray:120; stroke-dashoffset:120; animation:draw 1.1s ease-out forwards, pulseGlow 3.2s ease-in-out 1.2s infinite}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 2px rgba(31,81,255,.5))}50%{filter:drop-shadow(0 0 9px rgba(31,81,255,.95))}}
  h1{font-size:19px; margin:0; letter-spacing:.4px}
  h1 span{color:var(--blue2)}
  .sub{color:var(--muted); font-size:12.5px; margin:2px 0 0}
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-radius:20px; padding:18px 16px 16px; margin-top:16px;
    box-shadow:0 14px 34px rgba(0,0,0,.45);
  }
  label{display:block; font-size:12px; font-weight:700; letter-spacing:1.2px; color:var(--muted); margin:14px 0 7px 2px}
  label:first-of-type{margin-top:0}
  .field{position:relative}
  input{
    width:100%; background:#0a1228; border:2px solid var(--line); border-radius:14px;
    color:var(--text); font-size:30px; font-weight:800; padding:12px 58px 12px 15px; outline:none;
    transition:border-color .2s;
  }
  .unit{position:absolute; right:16px; top:50%; transform:translateY(-50%); font-weight:800; color:var(--blue2); font-size:17px; pointer-events:none}
  /* EFFECT 5: focus glow pulse */
  input:focus{border-color:var(--blue); animation:focusPulse 1.6s ease-in-out infinite}
  @keyframes focusPulse{0%,100%{box-shadow:0 0 0 3px rgba(31,81,255,.22)}50%{box-shadow:0 0 0 6px rgba(31,81,255,.38)}}
  /* EFFECT 7: invalid input shake + red flash */
  input.bad{border-color:#ff4d5e !important; animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .swaprow{display:flex; justify-content:center; margin:13px 0 0}
  button{font-family:inherit; cursor:pointer; border:none; position:relative; overflow:hidden}
  /* EFFECT 6: ripple on press */
  .ripple::after{content:""; position:absolute; left:50%; top:50%; width:8px; height:8px; border-radius:50%;
    background:rgba(255,255,255,.55); transform:translate(-50%,-50%) scale(0); opacity:0}
  .ripple:active::after{animation:rip .55s ease-out}
  @keyframes rip{0%{transform:translate(-50%,-50%) scale(0); opacity:.8}100%{transform:translate(-50%,-50%) scale(22); opacity:0}}
  #swap{
    background:var(--blue); color:#fff; font-size:21px; width:58px; height:58px; border-radius:50%;
    box-shadow:0 8px 20px rgba(31,81,255,.45); display:flex; align-items:center; justify-content:center;
  }
  /* EFFECT 3: swap flip */
  #swap.flip{animation:flip .55s ease}
  @keyframes flip{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .result{
    margin-top:15px; background:#0a1228; border:1px dashed var(--line); border-radius:14px;
    padding:13px 15px; text-align:center; min-height:76px;
  }
  /* EFFECT 4: result pop on change */
  .result.pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.96); opacity:.55}60%{transform:scale(1.02)}100%{transform:scale(1); opacity:1}}
  .result .big{font-size:29px; font-weight:900; letter-spacing:.2px}
  .result .big b{color:var(--gold)}
  .result .eq{color:var(--muted); font-size:13px; margin-top:3px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px}
  .chip{background:#0a1228; color:var(--text); border:1px solid var(--line); padding:10px 0; border-radius:999px;
    font-size:14.5px; font-weight:700; flex:1 1 17%; transition:border-color .15s, background .15s}
  .chip:active{background:var(--blue); border-color:var(--blue)}
  .chipslabel{font-size:11px; color:var(--muted); letter-spacing:1px; font-weight:700; margin:16px 0 0 2px}
  .rowbtns{display:flex; gap:9px; margin-top:15px}
  .btn{flex:1; padding:14px 0; border-radius:13px; font-size:16px; font-weight:800}
  #copy{background:var(--gold); color:#231a00}
  #clear{background:#0a1228; color:var(--text); border:1px solid var(--line)}
  #install{display:none; width:100%; margin-top:13px; background:var(--blue); color:#fff; padding:15px 0; border-radius:13px; font-size:16.5px; font-weight:800}
  footer{margin-top:20px; text-align:center; color:var(--muted); font-size:12px; line-height:1.65}
  footer b{color:var(--text); letter-spacing:1.4px}
</style>
</head>
<body>
<div class="glow a"></div><div class="glow b"></div>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0e1730"/><path class="arc" d="M14 50 A 26 26 0 0 1 50 14" fill="none" stroke="#1F51FF" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="50" r="5" fill="#ffd34d"/></svg>
    <div>
      <h1>ARC BEVERAGE <span>CO.</span></h1>
      <p class="sub">⚖️ KG · G · OZ · LB Converter — dock quick tool</p>
    </div>
  </header>

  <div class="card">
    <label for="kg">KILOGRAMS</label>
    <div class="field"><input id="kg" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">kg</span></div>

    <label for="g">GRAMS</label>
    <div class="field"><input id="g" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">g</span></div>

    <div class="swaprow"><button id="swap" class="ripple" aria-label="Swap kilograms and pounds">⇅</button></div>

    <label for="lb">POUNDS</label>
    <div class="field"><input id="lb" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">lb</span></div>

    <label for="oz">OUNCES</label>
    <div class="field"><input id="oz" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span class="unit">oz</span></div>

    <div class="result" id="resultBox">
      <div class="big" id="bigResult">Type a weight 👆</div>
      <div class="eq" id="eqLine">1 kg = 2.20462 lb · 1 lb = 16 oz · 1 lb = 453.59 g</div>
    </div>

    <p class="chipslabel">QUICK KG</p>
    <div class="chips" id="chips"></div>

    <div class="rowbtns">
      <button id="copy" class="btn ripple">📋 Copy result</button>
      <button id="clear" class="btn ripple">Clear</button>
    </div>
    <button id="install" class="ripple">📲 Install as app</button>
  </div>

  <footer><b>ARC BEVERAGE CO.</b><br>1 kg = 2.20462 lb · 1 lb = 16 oz = 453.592 g · works offline once installed</footer>
</div>

<script>
const FACTOR = 2.20462262185; /* lb per kg */
const kgEl = document.getElementById('kg'), gEl = document.getElementById('g'), lbEl = document.getElementById('lb'), ozEl = document.getElementById('oz');
const els = { kg: kgEl, g: gEl, lb: lbEl, oz: ozEl };
const box = document.getElementById('resultBox'), big = document.getElementById('bigResult'), eq = document.getElementById('eqLine');
let lastEdited = 'kg', displayed = 0, tween = null;

const fmt  = n => n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtG = n => n.toLocaleString('en-US',{maximumFractionDigits:2});
function parse(el){ const v = parseFloat(String(el.value).replace(',','.')); return isFinite(v) ? v : null; }
function toKg(src, v){ return src==='kg' ? v : src==='g' ? v/1000 : src==='oz' ? v/(FACTOR*16) : v/FACTOR; }
function fromKg(src, kg){ return src==='kg' ? kg : src==='g' ? kg*1000 : src==='oz' ? kg*FACTOR*16 : kg*FACTOR; }

/* EFFECT 2: count-up tween on the result number */
function tweenTo(target, unit){
  cancelAnimationFrame(tween);
  const from = displayed, start = performance.now(), dur = 450;
  const step = now => {
    const t = Math.min(1,(now-start)/dur), e = 1-Math.pow(1-t,3);
    displayed = from + (target-from)*e;
    big.innerHTML = fmt(displayed) + ' <b>' + unit + '</b>';
    if(t<1) tween = requestAnimationFrame(step);
  };
  tween = requestAnimationFrame(step);
}
function pop(){ box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop'); }

function update(source){
  const el = els[source], v = parse(el);
  el.classList.remove('bad');
  if(el.value.trim() !== '' && v === null){ el.classList.add('bad'); big.textContent = 'Numbers only ⚠️'; eq.textContent = 'Check that entry'; return; }
  if(v === null || v === 0){
    for(const k in els){ if(k !== source) els[k].value = ''; }
    big.textContent = 'Type a weight 👆'; eq.textContent = '1 kg = 2.20462 lb · 1 lb = 16 oz · 1 lb = 453.59 g'; displayed = 0; return;
  }
  const kg = toKg(source, v);
  for(const k in els){
    if(k === source) continue;
    els[k].value = (k === 'g') ? fmtG(fromKg(k, kg)) : fmt(fromKg(k, kg));
  }
  const target = (source === 'lb') ? 'kg' : 'lb';
  tweenTo(fromKg(target, kg), target);
  eq.textContent = fmtG(fromKg('g', kg)) + ' g  =  ' + fmt(kg) + ' kg  =  ' + fmt(fromKg('oz', kg)) + ' oz  =  ' + fmt(fromKg('lb', kg)) + ' lb';
  pop();
}
kgEl.addEventListener('input', ()=>{ lastEdited='kg'; update('kg'); });
gEl .addEventListener('input', ()=>{ lastEdited='g';  update('g');  });
lbEl.addEventListener('input', ()=>{ lastEdited='lb'; update('lb'); });
ozEl.addEventListener('input', ()=>{ lastEdited='oz'; update('oz'); });

document.getElementById('swap').addEventListener('click', e=>{
  const b = e.currentTarget; b.classList.remove('flip'); void b.offsetWidth; b.classList.add('flip');
  const k = kgEl.value; kgEl.value = lbEl.value; lbEl.value = k;
  lastEdited = 'kg'; update('kg');
});

[10,25,50,100,250,500].forEach(n=>{
  const c = document.createElement('button');
  c.className='chip ripple'; c.textContent = n;
  c.addEventListener('click', ()=>{ kgEl.value = n; lastEdited='kg'; update('kg'); kgEl.focus(); });
  document.getElementById('chips').appendChild(c);
});

document.getElementById('copy').addEventListener('click', async ()=>{
  const t = eq.textContent;
  try{ await navigator.clipboard.writeText(t); big.innerHTML = '✅ Copied!'; setTimeout(()=>update(lastEdited), 900); }
  catch(e){ big.textContent = t; }
});
document.getElementById('clear').addEventListener('click', ()=>{ kgEl.value=''; gEl.value=''; lbEl.value=''; ozEl.value=''; update('kg'); kgEl.focus(); });

/* PWA install */
let deferredPrompt = null;
const installBtn = document.getElementById('install');
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt = e; installBtn.style.display='block'; });
installBtn.addEventListener('click', async ()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; installBtn.style.display='none'; });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
