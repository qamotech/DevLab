<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Timestamp Converter</title>
<style>
:root{--bg:#0b0e14;--panel:#121722;--line:#232c3d;--text:#e8edf5;--muted:#8b96ab;--accent:#f0abfc;color:var(--text);background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0}
header{max-width:900px;margin:auto;padding:26px 24px 18px}
h1{font-size:22px;margin:0;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
main{max-width:900px;margin:auto;padding:0 24px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px}
.pad{padding:22px}
h2{font-size:13px;margin:0 0 16px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.now{text-align:center;padding:6px 0 2px}
.now .big{font:700 40px/1.2 ui-monospace,Consolas,monospace;color:var(--accent)}
.now .lbl{color:var(--muted);font-size:12px;margin-top:6px}
.field{margin-bottom:16px}
label{font-size:12px;font-weight:600;display:block;margin-bottom:8px;color:var(--muted)}
input[type=text],input[type=datetime-local]{width:100%;background:#0a0d13;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:12px;font:14px ui-monospace,Consolas,monospace;color-scheme:dark}
input:focus{outline:none;border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{background:#1a2233;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#0b0e14}
.out{background:#0a0d13;border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:12px;font:13px/2 ui-monospace,Consolas,monospace}
.out .k{color:var(--muted);display:inline-block;min-width:170px}
.err{color:#fb7185;font-size:13px;margin-top:8px;min-height:18px}
@media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Timestamp Converter</h1><p class="sub">Unix timestamps, ISO strings and human dates — both directions.</p></header>
<main>
<div class="panel"><div class="pad">
<h2>Right now</h2>
<div class="now"><div class="big" id="nowTs">—</div><div class="lbl">current Unix timestamp (seconds) · <span id="nowIso"></span></div></div>
</div></div>
<div class="panel"><div class="pad">
<h2>Timestamp → date</h2>
<div class="field"><label>Unix timestamp (seconds or milliseconds)</label>
<input type="text" id="tsIn" placeholder="1792506000" autocomplete="off"></div>
<div class="err" id="err1"></div>
<div class="out" id="out1" style="display:none"></div>
</div></div>
<div class="panel"><div class="pad">
<h2>Date → timestamp</h2>
<div class="row">
<div class="field"><label>Date &amp; time (local)</label>
<input type="datetime-local" id="dateIn"></div>
<div class="field"><label>…or paste an ISO / date string</label>
<input type="text" id="isoIn" placeholder="2026-10-20T14:30:00" autocomplete="off"></div>
</div>
<button class="primary" id="toTs">Convert to timestamp</button>
<div class="err" id="err2"></div>
<div class="out" id="out2" style="display:none"></div>
</div></div>
</main>
<a href="index.html" style="position:fixed;bottom:14px;left:14px;background:#0ea5e9;color:#04121f;font:700 13px/1 system-ui,sans-serif;padding:10px 16px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(14,165,233,.4);z-index:9999;">← DevLab home</a>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
function tick(){
  const n=Date.now();
  $("nowTs").textContent=Math.floor(n/1000);
  $("nowIso").textContent=new Date(n).toISOString();
}
setInterval(tick,1000);tick();
$("tsIn").addEventListener("input",()=>{
  const raw=$("tsIn").value.trim().replace(/[^0-9]/g,"");
  const o=$("out1"),e=$("err1");e.textContent="";
  if(!raw){o.style.display="none";return;}
  let ms=+raw;if(raw.length<=10)ms*=1000;
  const d=new Date(ms);
  if(isNaN(d)){e.textContent="Not a valid timestamp.";o.style.display="none";return;}
  o.style.display="";o.innerHTML=
    `<span class="k">Local:</span>${d.toLocaleString()}<br>`+
    `<span class="k">UTC:</span>${d.toUTCString()}<br>`+
    `<span class="k">ISO 8601:</span>${d.toISOString()}<br>`+
    `<span class="k">Unix (s):</span>${Math.floor(ms/1000)}<br>`+
    `<span class="k">Unix (ms):</span>${ms}`;
});
function toTs(){
  const e=$("err2"),o=$("out2");e.textContent="";
  let d=null;
  const iso=$("isoIn").value.trim();
  if(iso){d=new Date(iso);}
  else if($("dateIn").value){d=new Date($("dateIn").value);}
  else{e.textContent="Enter a date first.";o.style.display="none";return;}
  if(isNaN(d)){e.textContent="Couldn't parse that date.";o.style.display="none";return;}
  const ms=d.getTime();
  o.style.display="";o.innerHTML=
    `<span class="k">Unix (s):</span>${Math.floor(ms/1000)}<br>`+
    `<span class="k">Unix (ms):</span>${ms}<br>`+
    `<span class="k">ISO 8601:</span>${d.toISOString()}<br>`+
    `<span class="k">UTC:</span>${d.toUTCString()}`;
}
$("toTs").addEventListener("click",toTs);
$("isoIn").addEventListener("keydown",e=>{if(e.key==="Enter")toTs();});
})();
</script>
</body>
</html>
